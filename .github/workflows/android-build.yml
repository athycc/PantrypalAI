name: Android CI Build (Capacitor)

on:
  push:
    branches: [ main, master, ci/android-capacitor ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Android SDK root
        run: echo "ANDROID_SDK_ROOT=$RUNNER_TEMP/android-sdk" >> $GITHUB_ENV

      - name: Setup Android SDK (google-github-actions/setup-android)
        uses: google-github-actions/setup-android@v2
        with:
          api-level: 33
          build-tools: 33.0.2
          components: |
            platform-tools
            platforms;android-33
            build-tools;33.0.2
          ndk: false
        continue-on-error: true
        # If this action cannot be resolved on the runner, the workflow will fail
        # and fallback to the manual sdkmanager approach can be reintroduced.

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Fallback: Install Android SDK command-line tools (if missing)
        run: |
          set -euo pipefail
          if [ -x "$ANDROID_SDK_ROOT/platform-tools/adb" ] || [ -d "$ANDROID_SDK_ROOT/platform-tools" ]; then
            echo "SDK already present, skipping manual install"
            exit 0
          fi
          echo "SDK not found — installing command-line tools via sdkmanager"
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          for i in 1 2 3; do
            wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip && break || sleep 5
          done
          unzip -q cmdline-tools.zip -d $ANDROID_SDK_ROOT/cmdline-tools
          mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest || true
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT --licenses || true
          for i in 1 2 3; do
            $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platform-tools" "platforms;android-33" "build-tools;33.0.2" && break || sleep 5
          done

      - name: Install dependencies (npm ci, fallback to npm install)
        run: |
          echo "Running npm ci (verbose) and saving log"
          set -euo pipefail
          # Try npm ci first (fast, clean). If it fails, fall back to npm install.
          npm ci --verbose 2>&1 | tee npm-ci.log || (
            echo "npm ci failed, falling back to npm install";
            npm install --verbose 2>&1 | tee npm-ci.log
          )

      - name: Upload npm install log
        uses: actions/upload-artifact@v4
        with:
          name: npm-ci-log
          path: npm-ci.log

      - name: Build web (Vite)
        run: npm run build

      - name: Ensure Capacitor CLI
        run: npx --yes @capacitor/cli --version

      - name: Sync Capacitor Android platform (add + copy)
        run: |
          echo "Running npx cap sync android"
          npx cap sync android || ( echo "cap sync failed, retrying" && npx cap sync android )

      - name: Debug Android directory and Capacitor packages
        run: |
          echo "--- npm list @capacitor packages ---"
          npm ls @capacitor/core @capacitor/android @capacitor/cli || true
          echo "--- android directory listing ---"
          ls -la android || true
          echo "--- recursive android listing (first 200 lines) ---"
          (ls -R android || true) | sed -n '1,200p'
          echo "--- gradlew info ---"
          if [ -f android/gradlew ]; then ls -la android/gradlew; android/gradlew --version || true; fi
          echo "--- show top-level Android Gradle files (first 200 lines) ---"
          for f in android/*.gradle android/**/build.gradle android/**/settings.gradle android/**/gradle.properties 2>/dev/null; do
            if [ -f "$f" ]; then echo "--- FILE: $f ---"; sed -n '1,200p' "$f" || true; fi
          done || true

      - name: Inspect Android dir and make gradlew executable
        run: |
          echo "--- android directory listing ---"
          ls -la android || true
          if [ -f android/gradlew ]; then chmod +x android/gradlew; fi
          if [ -f android/gradlew ]; then android/gradlew --version || true; fi

      - name: Write Android local.properties
        run: |
          echo "Writing local.properties pointing to SDK"
          mkdir -p android || true
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "Contents:" && sed -n '1,200p' android/local.properties || true

      - name: Assemble APK
        run: |
          cd android
          chmod +x gradlew || true
          echo "Running Gradle assemble (debug + release) with stacktrace"
          ./gradlew assembleDebug --no-daemon --stacktrace --parallel --configure-on-demand 2>&1 | tee ../../gradle-assemble-debug.log
          ./gradlew assembleRelease --no-daemon --stacktrace --parallel --configure-on-demand 2>&1 | tee -a ../../gradle-assemble-debug.log || true

      - name: Upload Gradle build log
        uses: actions/upload-artifact@v4
        with:
          name: gradle-assemble-log
          path: gradle-assemble-debug.log

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk


      - name: Sign release APK (optional)
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "Decoding keystore from env"
          mkdir -p android/keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/keystore/keystore.jks
          APK_IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          APK_ALIGNED=android/app/build/outputs/apk/release/app-release-aligned.apk
          APK_SIGNED=android/app/build/outputs/apk/release/app-release-signed.apk
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/33.0.2"
          echo "Aligning APK"
          $BUILD_TOOLS/zipalign -v -p 4 $APK_IN $APK_ALIGNED
          echo "Signing APK"
          if [ -n "$ANDROID_KEY_ALIAS" ]; then
            $BUILD_TOOLS/apksigner sign --ks android/keystore/keystore.jks --ks-key-alias $ANDROID_KEY_ALIAS --ks-pass pass:$ANDROID_KEYSTORE_PASSWORD --key-pass pass:$ANDROID_KEY_PASSWORD --out $APK_SIGNED $APK_ALIGNED || true
          else
            $BUILD_TOOLS/apksigner sign --ks android/keystore/keystore.jks --ks-pass pass:$ANDROID_KEYSTORE_PASSWORD --key-pass pass:$ANDROID_KEY_PASSWORD --out $APK_SIGNED $APK_ALIGNED || true
          fi

      - name: Upload signed release APK (if present)
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: android/app/build/outputs/apk/release/app-release-signed.apk
